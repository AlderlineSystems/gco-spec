[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gco-spec"
version = "0.1.0"
description = "Reference implementation for Sovereign Safety Labs GCO derivation contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "PyJWT>=2.8",
    "pydantic>=2.8",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/gco"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
    "class .*\\(Protocol\\):",
    "\\.\\.\\.",
]
