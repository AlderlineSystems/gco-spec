name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: Python ${{ matrix.python-version }}
    # Keep private-repository Actions usage within the account's runner budget.
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install build

      - name: Run tests with coverage
        run: python -m pytest --cov=src/gco --cov=src/gco_mcp --cov-branch --cov-report=term-missing -q

      - name: Run audit harnesses
        run: |
          for audit in audit_*.py; do
            python "$audit"
          done

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify schema is packaged
        run: |
          python - <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          if not any(name.endswith("schemas/gco_schema_v1.json") for name in names):
              raise SystemExit("schemas/gco_schema_v1.json missing from wheel")
          if not any(name.startswith("gco_mcp/") for name in names):
              raise SystemExit("gco_mcp package missing from wheel")
          print(f"verified schema in {wheels[0]}")
          sys.exit(0)
          PY

  notify-openbot:
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.test.result == 'failure') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send main CI failure to OpenBot
        env:
          OPENBOT_URL: ${{ vars.OPENBOT_CI_WEBHOOK_URL }}
          OPENBOT_SECRET: ${{ secrets.OPENBOT_CI_WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.error, urllib.request

          url = os.environ['OPENBOT_URL']
          secret = os.environ['OPENBOT_SECRET']
          if not url or not secret:
              raise SystemExit('OpenBot webhook URL or secret is missing')
          repository = os.environ['REPOSITORY']
          run_id, attempt = os.environ['RUN_ID'], os.environ['RUN_ATTEMPT']
          delivery = f'github-{run_id}-{attempt}'
          body = json.dumps({'type': 'github.ci.failure', 'data': {
              'repository': repository, 'branch': 'main', 'conclusion': 'failure',
              'test': os.environ['EVENT_NAME'] == 'workflow_dispatch',
              'run_url': f"{os.environ['SERVER_URL']}/{repository}/actions/runs/{run_id}",
          }}, separators=(',', ':')).encode()
          for wait in (0, 15, 45):
              if wait:
                  time.sleep(wait)
              stamp = str(int(time.time()))
              signed = stamp.encode() + b'.' + delivery.encode() + b'.' + body
              signature = hmac.new(secret.encode(), signed, hashlib.sha256).hexdigest()
              request = urllib.request.Request(url, data=body, headers={
                  'Content-Type': 'application/json', 'X-OpenBot-Timestamp': stamp,
                  'X-OpenBot-Delivery-Id': delivery,
                  'X-OpenBot-Signature': 'sha256=' + signature,
              })
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status in (200, 202):
                          print('OpenBot accepted or already recorded the delivery')
                          break
                      raise SystemExit(f'Unexpected HTTP status: {response.status}')
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 503):
                      raise SystemExit(f'OpenBot rejected the delivery: HTTP {error.code}')
              except urllib.error.URLError:
                  pass
          else:
              raise SystemExit('OpenBot unavailable after retries; event needs manual review')
          PY
